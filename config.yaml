# Deep Structural Analysis — 模块加载配置
# 默认：全家桶（全部启用）。按需关闭不需要的模块以节省上下文。
# 修改后立即生效，无需重启。

version: "1.0"

# ============================================================
# 深度控制
# ============================================================
depth:
  # 默认分析深度：Focused(3-4透镜) | Standard(5-7) | Comprehensive(7-9)
  default: Standard

  # 自动降级：Clear/Complicated 域是否自动切换到 lite 模式
  auto_degrade_to_lite: true

# ============================================================
# 扩展模块（enabled: true = 加载, false = 跳过）
# ============================================================
extensions:

  # 批处理+多问题分流 — N≥5 相关项或同时多个不相关问题时加载
  batch_analysis:
    enabled: true

  # 退出+降级协议 — "说人话"/"简单点" 或拒绝澄清时加载
  exit_protocols:
    enabled: true

  # 认知递进协议 — L1→L2→L3，"第一感觉是..." 时加载
  layered_protocol:
    enabled: true

  # 创伤敏感+过度抽象化 — 涉暴力/歧视/具体伤害时加载
  trauma_sensitive:
    enabled: true

  # 对话式分析 — "先聊聊"/"探讨一下" 时加载
  interactive:
    enabled: true

  # 离线回退 — 搜索不可用时自动加载（建议保持启用）
  offline_fallback:
    enabled: true

# ============================================================
# 预设方案（取消注释以激活）
# ============================================================
# 轻量方案：仅核心框架 + 退出协议
# extensions:
#   batch_analysis:   { enabled: false }
#   exit_protocols:    { enabled: true  }
#   layered_protocol:  { enabled: false }
#   trauma_sensitive:  { enabled: false }
#   interactive:       { enabled: false }
#   offline_fallback:  { enabled: true  }

# 速查方案：仅核心框架，所有扩展关闭
# extensions:
#   batch_analysis:   { enabled: false }
#   exit_protocols:    { enabled: false }
#   layered_protocol:  { enabled: false }
#   trauma_sensitive:  { enabled: false }
#   interactive:       { enabled: false }
#   offline_fallback:  { enabled: false }
